<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>두근두근 영어</title>
</head>
<body>
    <!--
        사용자: 영어에 대한 두려움이나 부담을 느끼는 학습자
        목적: 영어의 기본기를 탄탄하게 익히고 영어에 대한 자신감 향상
        핵심 행동: 매일 수준에 맞는 랜덤 영어 단어와 문장을 반복 학습, 원어민과 화상통화로 소통, 게임 요소가 포함된 학습 콘텐츠 진행
        정보: 매일 영어 단어와 문장 학습 → 단어와 문장을 토대로 원어민과의 화상통화 진행 → 복습 및 예습을 위한 게임형 영어 학습 콘텐츠 진행
    -->

    <header>
        <h1>영어 울렁증 극복 서비스</h1>
        <p>탄탄한 영어 기본기를 쌓고 원어민과 직접 소통하며
            영어에 대한 두려움을 자신감으로 바꿉니다.</p>
    </header>
</body>
</html>
